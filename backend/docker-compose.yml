services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    
    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./src:/app/src

    depends_on:
      - redis
      - qdrant
      - postgres
      - minio

  ingestion-worker:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile

    env_file:
      - .env

    volumes:
      - ./src:/app/src

    depends_on:
      - redis
      - qdrant
      - postgres
      - minio

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant

    ports:
      - "6333:6333"

    volumes:
      - ./data/qdrant:/qdrant/storage
  
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"
    
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  
  minio:
    image: minio/minio

    ports:
      - "9000:9000"
      - "9001:9001"
    
    volumes:
      - ./data/minio:/data

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword

    command: server /data --console-address ":9001"

  flower:
    image: mher/flower
    command: celery --broker=redis://redis:6379/0 flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
  adminer:
    image: adminer
    ports:
      - "8080:8080"